name: Decompilation progress

on:
  pull_request:
    paths:
      - 'decomp/**'
      - '.github/workflows/decomp-progress.yml'
  push:
    branches: [main]
    paths:
      - 'decomp/**'
      - '.github/workflows/decomp-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test executable inventory and exact-match accounting
        run: python -m unittest discover -s decomp/tools
      - name: Check PS2 code ranges and function objects with synthetic inputs
        run: |
          docker build -t openscct-ps2 decomp/ps2/toolchain
          docker run --rm --network none -v "$PWD:/work:ro" openscct-ps2 python -m unittest discover -s decomp/tests
      - name: Verify source receipts and regenerate the public feed in memory
        run: python -I decomp/tools/progress.py report --check

  bytematch:
    needs: progress
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [steam-252084-campaign, steam-252084-versus]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Export measured code from the same receipts used on the website
        run: python decomp/tools/bytematch.py pc "${{ matrix.target }}" build/report.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_report
          path: build/report.json
          if-no-files-found: error
