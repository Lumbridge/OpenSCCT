name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Prepare Windows, Linux, Flatpak and VPS release artifacts for this commit
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip
  DOTNET_PROCESSOR_COUNT: "2"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Cheapest check first: nothing game-derived may reach the repo.
      - name: Game data guard
        run: python tools/ci/no_game_data.py

      - name: Documentation links and coverage summary
        run: python tools/ci/docs.py

      # The vendored scctpkg must be exactly the recorded upstream files plus the listed local patches.
      - name: Vendored scctpkg check
        run: python tools/scctpkg/sync.py --check

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build OpenSCCT.slnx -c Release

      # Microsoft.Testing.Platform runner (global.json). Exit code 8 means a test project has no
      # tests yet; drop the ignore once every project has some.
      - name: Test
        run: dotnet test --solution OpenSCCT.slnx -c Release --no-build --ignore-exit-code 8 --max-parallel-test-modules 2 -- --filter-not-namespace 'OpenScct.Integration.Tests*'

      - name: Publish dedicated server (linux-x64)
        run: >-
          dotnet publish src/OpenScct.Server.Cli/OpenScct.Server.Cli.csproj -c Release -r linux-x64
          --self-contained false -o "$RUNNER_TEMP/svm-server-linux-x64"

      - uses: actions/upload-artifact@v7
        with:
          name: svm-server-linux-x64
          path: ${{ runner.temp }}/svm-server-linux-x64
          retention-days: 7

      # Planned: both jobs upload their replay hash and a small job compares win-x64 with linux-x64.
      - name: Determinism hash (placeholder)
        run: |
          if [ -f tools/OpenScct.Tools/OpenScct.Tools.csproj ]; then
            dotnet run --project tools/OpenScct.Tools -c Release -- determinism
          else
            echo "tools/OpenScct.Tools does not exist yet, skipping"
          fi

      - name: Python tests
        run: |
          python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt -r content/requirements.txt
          python -m pytest tools/ci/tests -q
          python -m pytest tests/content -q
          # Reverse-engineering tools: their tests use synthetic data only (no game files in CI).
          (cd re/tools && python -m pytest -q)
          (cd re/formats && python -m pytest -q)
          (cd re/ghidra/scripts/transfer && python -m pytest -q)

  windows:
    # Private repo minutes count double on Windows: keep this job to what only Windows can check.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Game data guard
        run: python tools/ci/no_game_data.py

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build OpenSCCT.slnx -c Release

      # Microsoft.Testing.Platform runner (global.json). Exit code 8 means a test project has no
      # tests yet; drop the ignore once every project has some.
      - name: Test
        run: dotnet test --solution OpenSCCT.slnx -c Release --no-build --ignore-exit-code 8 --max-parallel-test-modules 2 -- --filter-not-namespace 'OpenScct.Integration.Tests*'

      - name: Banned API check
        run: ./tools/ci/check-banned-api.ps1

      - name: Determinism hash (placeholder)
        shell: bash
        run: |
          if [ -f tools/OpenScct.Tools/OpenScct.Tools.csproj ]; then
            dotnet run --project tools/OpenScct.Tools -c Release -- determinism
          else
            echo "tools/OpenScct.Tools does not exist yet, skipping"
          fi

  integration:
    name: Integration (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build integration tests
        run: dotnet build tests/OpenScct.Integration.Tests -c Release
      - name: Provision memory for the full-world Hub crowd soak
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $crowd = 'OpenScct.Integration.Tests.Hub.HubSoakTests.FiftyVisitorsStayInWithinTheBandwidthBudget'
          if ($crowd -in (./tools/ci/integration-shard.ps1 -Shard ${{ matrix.shard }} -Plan)) {
            bash tools/ci/prepare-crowd-memory.sh
            if ($LASTEXITCODE -ne 0) { throw 'Could not provision memory for the full-world Hub soak.' }
            'DOTNET_GCConserveMemory=9' | Add-Content $env:GITHUB_ENV
          }
      - name: Run integration shard
        shell: pwsh
        run: ./tools/ci/integration-shard.ps1 -Shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.os }}-${{ matrix.shard }}
          path: local/test-results/integration-*.xml
          retention-days: 7

  # The smokes that need no game content (docs/TESTING-PLAY.md, "Trusting the smokes", CI): boot, TestBox (a tracked fixture)
  # and TestRange generated here from tools/testmap without the install. Every other smoke plays converted maps and
  # the install's characters, HUD and sounds, which never reach the repository.
  godot-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The editor zip is not cached, only the verified install (Get-Godot.ps1 skips the download then).
      - uses: actions/cache@v6
        with:
          path: |
            tools/godot
            !tools/godot/downloads/**/*.zip
            !tools/godot/downloads/**/*.tpz
          key: godot-${{ runner.os }}-${{ hashFiles('godot-version.txt') }}

      # TestRange as a machine without the game makes it (no class table), into .content/svmap/TestRange where the
      # game looks; the station manifest it writes must be the tracked one.
      - name: Generate TestRange
        run: |
          python -m pip install --disable-pip-version-check -r content/requirements.txt
          python -B tools/testmap/generate.py --no-classes --stations-out "$env:RUNNER_TEMP/stations.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); sys.exit(0 if a == b else 'fixtures/testrange/stations.json is not what tools/testmap makes')" fixtures/testrange/stations.json "$env:RUNNER_TEMP/stations.json"

      - name: Godot headless smokes
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate || false }}
        run: |
          ./tools/ci/godot-smoke.ps1 -Tests boot,testbox,range-sim,help-feedback -ExpectedFailures selftest-fail -TimeoutSeconds 180 -Export:($env:RELEASE_CANDIDATE -eq 'true')

      - name: Record Windows export provenance
        if: inputs.release_candidate
        run: |
          @{ commit = $env:GITHUB_SHA; platform = 'win-x64' } | ConvertTo-Json | Set-Content local/build/openscct-build.json

      - uses: actions/upload-artifact@v7
        if: inputs.release_candidate
        with:
          name: openscct-windows-export
          path: local/build
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-smoke
          path: local/test-results
          retention-days: 7

  release-linux:
    if: inputs.release_candidate
    uses: ./.github/workflows/linux-export.yml

  release-vps:
    if: inputs.release_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare self-contained VPS packages
        shell: pwsh
        run: ./tools/deploy/Deploy-Vps.ps1 -PackageOnly local/deploy-package
      - uses: actions/upload-artifact@v7
        with:
          name: openscct-vps
          path: local/deploy-package
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
