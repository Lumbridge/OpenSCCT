name: allocation-diagnostics
on:
  push:
    branches: [fix/allocation-ci-diagnostics]
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.source }} tiered=${{ matrix.tiered }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
        tiered: ['1', '0']
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source == 'baseline' && 'fc4b046dff1c8ff09764c8716c99a79274348a29' || 'a2273eb6e5c6746a1ba012cebf153fcd3be70bca' }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Record exact source and runtime
        shell: bash
        run: |
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/source.txt
          dotnet --info > diagnostic/dotnet-info.txt
          uname -a > diagnostic/os.txt
          env | sort | grep -E '^(DOTNET_|ImageOS=|ImageVersion=|RUNNER_OS=|RUNNER_ARCH=)' > diagnostic/environment.txt
          sha256sum build/AllocationProbe.cs tests/OpenScctGame.Logic.Tests/PlayFrameStatsTests.cs tests/OpenScct.Game.Tests/AI/NavCostTests.cs tests/OpenScct.Integration.Tests/PredictionCollisionTests.cs > diagnostic/source-contract-sha256.txt
      - name: Build unchanged contract projects
        run: |
          dotnet build tests/OpenScctGame.Logic.Tests -c Release
          dotnet build tests/OpenScct.Game.Tests -c Release
          dotnet build tests/OpenScct.Integration.Tests -c Release
      - name: Repeat three exact allocation contracts in fresh processes
        shell: bash
        env:
          DOTNET_TieredCompilation: ${{ matrix.tiered }}
        run: |
          set +e
          printf 'iteration\tcontract\texit\n' > diagnostic/results.tsv
          echo "DOTNET_TieredCompilation=$DOTNET_TieredCompilation" >> diagnostic/environment.txt
          for i in $(seq 1 12); do
            dotnet tests/OpenScctGame.Logic.Tests/bin/Release/net10.0/OpenScctGame.Logic.Tests.dll -noLogo -method OpenScctGame.Logic.Tests.PlayFrameStatsTests.NormalPlayRetainsNoSamplesOrPerFrameAllocationsDuringALongSession -xml diagnostic/stats-$i.xml > diagnostic/stats-$i.log 2>&1 & stats=$!
            dotnet tests/OpenScct.Game.Tests/bin/Release/net10.0/OpenScct.Game.Tests.dll -noLogo -method OpenScct.Game.Tests.AI.NavCostTests.WarmReachabilityAcross6400NodesDoesNotAllocate -xml diagnostic/nav-$i.xml > diagnostic/nav-$i.log 2>&1 & nav=$!
            dotnet tests/OpenScct.Integration.Tests/bin/Release/net10.0/OpenScct.Integration.Tests.dll -noLogo -method OpenScct.Integration.Tests.PredictionCollisionTests.ReplayUsesTheObservedPawnCylindersAndRestoresTheirLivePoseWithoutBumpEffects -xml diagnostic/replay-$i.xml > diagnostic/replay-$i.log 2>&1 & replay=$!
            wait "$stats"; printf '%s\tstats\t%s\n' "$i" "$?" >> diagnostic/results.tsv
            wait "$nav"; printf '%s\tnav\t%s\n' "$i" "$?" >> diagnostic/results.tsv
            wait "$replay"; printf '%s\treplay\t%s\n' "$i" "$?" >> diagnostic/results.tsv
          done
          python3 - <<'PY'
          import csv,json,xml.etree.ElementTree as ET
          from pathlib import Path
          rows=list(csv.DictReader(open('diagnostic/results.tsv'),delimiter='\t'))
          assert len(rows)==36
          for row in rows:
              path=Path('diagnostic')/(row['contract']+'-'+row['iteration']+'.xml')
              assemblies=ET.parse(path).getroot().findall('assembly')
              assert len(assemblies)==1 and assemblies[0].get('total')=='1',(str(path),[a.attrib for a in assemblies])
              row['total']=int(assemblies[0].get('total'))
              row['failed']=int(assemblies[0].get('failed'))
              row['failureText']='\n'.join(t.text or '' for t in assemblies[0].iter('message'))
          Path('diagnostic/results.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps({'processes':len(rows),'failed':sum(r['failed'] for r in rows),'failures':[r for r in rows if r['failed']]}))
          raise SystemExit(1 if any(r['failed'] for r in rows) else 0)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allocations-${{ matrix.source }}-tiered-${{ matrix.tiered }}
          path: diagnostic
