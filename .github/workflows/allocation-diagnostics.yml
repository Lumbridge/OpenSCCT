name: allocation-fullsuite-diagnostics
on:
  push:
    branches: [fix/allocation-ci-diagnostics]
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.source }} tiered=${{ matrix.tiered }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
        tiered: ['1', '0']
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source == 'baseline' && 'fc4b046dff1c8ff09764c8716c99a79274348a29' || 'a2273eb6e5c6746a1ba012cebf153fcd3be70bca' }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Record exact source and runtime
        shell: bash
        run: |
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/source.txt
          dotnet --info > diagnostic/dotnet-info.txt
          uname -a > diagnostic/os.txt
          env | sort | grep -E '^(DOTNET_|ImageOS=|ImageVersion=|RUNNER_OS=|RUNNER_ARCH=)' > diagnostic/environment.txt
          sha256sum build/AllocationProbe.cs tests/OpenScctGame.Logic.Tests/PlayFrameStatsTests.cs tests/OpenScct.Game.Tests/AI/NavCostTests.cs tests/OpenScct.Integration.Tests/PredictionCollisionTests.cs > diagnostic/source-contract-sha256.txt
      - name: Build exact full solution as Linux CI
        run: dotnet build OpenSCCT.slnx -c Release
      - name: Run exact Linux MTP suite with two-module concurrency
        shell: bash
        env:
          DOTNET_TieredCompilation: ${{ matrix.tiered }}
        run: |
          set +e
          echo "DOTNET_TieredCompilation=$DOTNET_TieredCompilation" >> diagnostic/environment.txt
          dotnet test --solution OpenSCCT.slnx -c Release --no-build --ignore-exit-code 8 --max-parallel-test-modules 2 -- --filter-not-namespace 'OpenScct.Integration.Tests*' 2>&1 | tee diagnostic/full-suite.log
          result=${PIPESTATUS[0]}
          printf '{"exitCode":%s}\n' "$result" > diagnostic/result.json
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fullsuite-${{ matrix.source }}-tiered-${{ matrix.tiered }}
          path: diagnostic
