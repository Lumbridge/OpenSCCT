name: linux-export

on:
  pull_request:
    paths:
      - '.github/workflows/linux-export.yml'
      - 'game/**'
      - 'src/**'
      - 'packaging/**'
      - 'tools/linux/**'
      - 'Directory.*'
      - 'global.json'
      - 'godot-version.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-export.yml'
      - 'game/**'
      - 'src/**'
      - 'packaging/**'
      - 'tools/linux/**'
      - 'Directory.*'
      - 'global.json'
      - 'godot-version.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-export-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Linux export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak curl unzip python3 ripgrep libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libasound2t64 libpulse0
      - name: Install pinned toolchain and templates
        run: tools/linux/bootstrap.sh
      - name: Export and package
        run: |
          export DOTNET_ROOT="$PWD/local/toolchain/dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          export GODOT="$PWD/local/toolchain/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64"
          tools/linux/build.sh
      - name: Smoke the exported native runtime
        run: tools/linux/smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: openscct-linux-flatpak
          path: |
            local/dist/OpenSCCT-linux-x86_64.flatpak
            local/dist/SHA256SUMS
            local/linux/openscct-build.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openscct-linux-smoke-logs
          path: local/verification
          retention-days: 14
